name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 -m pytest -q -p no:cacheprovider
        env:
          MPLCONFIGDIR: /tmp/mplcache
